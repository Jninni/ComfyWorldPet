<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comfy World Pets – Sound Board</title>
<style>
  :root { --bg:#fdf6ee; --card:#fff; --ink:#5a4a5e; --accent:#f6a6c1; --accent2:#a8d8f0; --accent3:#c6e8b4; --accent4:#ffe08a; }
  * { box-sizing:border-box }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { margin:0 0 4px; font-size:22px } h2 { font-size:15px; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.06em; opacity:.8 }
  .row { display:flex; flex-wrap:wrap; gap:8px }
  button { border:0; border-radius:14px; padding:10px 14px; background:var(--card); color:var(--ink); font:inherit; font-weight:600;
           box-shadow:0 2px 0 rgba(90,74,94,.18); cursor:pointer; touch-action:manipulation }
  button:active { transform:translateY(1px); box-shadow:0 1px 0 rgba(90,74,94,.18) }
  button.music { background:var(--accent2) } button.jingle { background:var(--accent4) } button.note { background:var(--accent3) }
  button.on { outline:3px solid var(--accent) }
  #status { font-family:ui-monospace, monospace; font-size:12px; opacity:.75; margin-top:4px }
  label { display:inline-flex; align-items:center; gap:6px; margin-right:16px }
  table { border-collapse:collapse; font:12px ui-monospace, monospace } td { padding:2px 8px }
</style></head>
<body>
<h1>Sound Board</h1>
<div>Tap anywhere to unlock audio. <span id="status"></span></div>
<h2>Volume</h2>
<div class="row"><label>Music <input id="mv" type="range" min="0" max="1" step="0.01"></label><label>SFX <input id="sv" type="range" min="0" max="1" step="0.01"></label></div>
<h2>Music</h2><div class="row" id="music"></div>
<h2>Jingles</h2><div class="row" id="jingles"></div>
<h2>SFX</h2><div class="row" id="sfx"></div>
<h2>Notes</h2><div class="row" id="notes"></div>
<h2>Voices</h2><div id="voices"></div>
<h2>Offline check</h2><div class="row"><button id="analyze">Render &amp; analyse</button></div><div id="report"></div>
<script type="module" src="./audio.ts"></script>
</body></html>
