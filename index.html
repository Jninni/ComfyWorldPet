<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#cdb9f0" />
    <title>Comfy World Pets</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; background: #f3e6ff; overflow: hidden; }
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(ellipse at 50% 35%, #fff6fb 0%, #f3e6ff 60%, #dcc9f7 100%); font-family: system-ui, sans-serif; color: #4a3a52; transition: opacity .5s; }
      #boot .paw { font-size: 64px; animation: hop .9s ease-in-out infinite; }
      #boot .bar { width: min(340px, 70vw); height: 22px; border: 4px solid #4a3a52; border-radius: 999px; background: #fff; overflow: hidden; box-shadow: 0 4px 0 rgba(74,58,82,.25); }
      #boot .fill { height: 100%; width: 4%; background: repeating-linear-gradient(45deg, #f8b9cb 0 12px, #fbd3e0 12px 24px); border-radius: 999px; transition: width .3s; }
      #boot .msg { font-weight: 600; font-size: 18px; }
      @keyframes hop { 0%,100% { transform: translateY(0) rotate(-8deg) } 50% { transform: translateY(-18px) rotate(8deg) } }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="boot"><div class="paw">🐾</div><div class="bar"><div class="fill"></div></div><div class="msg">Fluffing pillows…</div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
